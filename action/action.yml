name: "MISRA CI"
description: "Scan C/C++ for MISRA-like issues, emit JUnit/HTML/SARIF, and gate by severity budgets."
author: "0rlych1kk4"
inputs:
  source:
    description: "Directory to scan"
    required: true
  rules:
    description: "Rules YAML file"
    required: true
  gate:
    description: "Budgets e.g. 'critical:0,high:5,medium:20,low:100'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      shell: bash
      run: cargo build --release -p misra_cli
    - name: Run scan
      shell: bash
      run: |
        ./target/release/misra_cli           --source "${{ inputs.source }}"           --rules "${{ inputs.rules }}"           --out dir:target/misra-ci           --gate "${{ inputs.gate }}"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: misra-reports
        path: target/misra-ci
branding:
  icon: "check-circle"
  color: "blue"
